<header class="site-header">
  <div class="container">
    <a class="site-title" href="{{ '/' | relative_url }}">
      <i class="fas fa-terminal"></i> {{ site.title }}
    </a>
    <nav class="site-nav">
      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <label for="nav-toggle" class="nav-toggle-label">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>
          <i class="fas fa-home"></i> 首页
        </a>
        <a href="{{ '/archives' | relative_url }}" {% if page.url contains '/archives' %}class="active"{% endif %}>
          <i class="fas fa-archive"></i> 归档
        </a>
        <a href="{{ '/categories' | relative_url }}" {% if page.url contains '/categories' %}class="active"{% endif %}>
          <i class="fas fa-folder"></i> 分类
        </a>
        <a href="{{ '/about' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>
          <i class="fas fa-user"></i> 关于
        </a>
        <a href="{{ '/feed.xml' | relative_url }}" target="_blank">
          <i class="fas fa-rss"></i> RSS
        </a>
      </div>
    </nav>
  </div>
</header>
