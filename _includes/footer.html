<footer class="site-footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-info">
        <p>&copy; {{ site.time | date: '%Y' }} <a href="https://github.com/{{ site.social.github }}">{{ site.author }}</a>. Powered by <a href="https://jekyllrb.com" target="_blank">Jekyll</a> &amp; <a href="https://pages.github.com" target="_blank">GitHub Pages</a>.</p>
      </div>
      <div class="footer-social">
        <a href="https://github.com/{{ site.social.github }}" target="_blank" title="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <a href="{{ '/feed.xml' | relative_url }}" target="_blank" title="RSS">
          <i class="fas fa-rss"></i>
        </a>
      </div>
    </div>
  </div>
</footer>
